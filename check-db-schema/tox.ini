[tox]
envlist = check-db-schema
skipsdist = true

[testenv:check-db-schema]
# For maintaining this tool itself: point CHECK_DB_SCHEMA_PROJECT at a local
# checkout of the service to test against; tox installs it into this env.
base_python = python3.11
deps =
    -rrequirements.txt
    -e{env:CHECK_DB_SCHEMA_PROJECT}
pass_env =
    CHECK_DB_SCHEMA_SERVER_URI
    CHECK_DB_SCHEMA_PROJECT
commands =
    python check_db_schema.py \
        --project-root {env:CHECK_DB_SCHEMA_PROJECT} \
        {env:CHECK_DB_SCHEMA_SERVER_URI:postgresql://postgres:check-db-schema@localhost:5432}
