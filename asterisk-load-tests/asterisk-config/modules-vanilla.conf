[modules]
autoload=yes

; Ensure required modules are loaded
preload => res_pjsip.so
preload => res_http_websocket.so

; Explicitly load modules we need for test
load => res_pjsip_header_funcs.so
load => chan_pjsip.so
load => res_ari.so
load => res_ari_channels.so

; No res_freeze_check.so here: this variant runs without the Wazo freeze-check
; addon (e.g. with asterisk-vanilla). A hang shows up as ARI health-check
; timeouts / stalled progress in the load generator instead of a SIGABRT.
