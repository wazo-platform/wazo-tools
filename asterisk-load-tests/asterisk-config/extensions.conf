[general]
static=yes
writeprotect=no

[loadtest]
; Calls originated by the load generator land here once the endpoint answers.
; Keeps the channel alive briefly so pollers can read its variables.
exten => s,1,NoOp(Load test call)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

exten => _X.,1,NoOp(Load test call to ${EXTEN})
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

[from-sipp]
; Inbound calls from a SIPp UAC building block (see sipp/uac.xml).
exten => _.,1,NoOp(Inbound call from SIPp)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()
