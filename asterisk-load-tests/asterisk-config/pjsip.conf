[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

; Endpoints the load generator originates through.
; Static contacts point at the SIPp UAS so outgoing Dial() always answers.
; Add or remove [loadtest-N] blocks to match --num-endpoints.

[loadtest-0]
type=endpoint
context=loadtest
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=loadtest-0

[loadtest-0]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[loadtest-1]
type=endpoint
context=loadtest
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=loadtest-1

[loadtest-1]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[loadtest-2]
type=endpoint
context=loadtest
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=loadtest-2

[loadtest-2]
type=aor
max_contacts=1
contact=sip:s@sipp:5060
