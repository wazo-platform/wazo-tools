[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

; Trunk endpoint for SIPp UAC (incoming calls)
[sipp-uac-trunk]
type=endpoint
context=from-sipp-uac
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[sipp-uac-trunk]
type=identify
endpoint=sipp-uac-trunk
match=sipp-uac

; 5 endpoints with PJSIP_HEADER in set_var (WebRTC enabled)
; Fewer endpoints = more serializer contention per endpoint
; Static contacts point to SIPp UAS

[deadlock-test-0]
type=endpoint
context=deadlock-test
disallow=all
allow=ulaw
allow=alaw
direct_media=no
webrtc=yes
aors=deadlock-test-0
set_var=PJSIP_HEADER(add,X-Endpoint-ID)=endpoint-0
set_var=PJSIP_HEADER(add,X-Customer-ID)=customer-0

[deadlock-test-0]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

