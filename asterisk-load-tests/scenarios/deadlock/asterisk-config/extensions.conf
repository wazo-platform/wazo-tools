[general]
static=yes
writeprotect=no

[deadlock-test]
; Simple extension that keeps channel alive briefly for polling
exten => s,1,NoOp(Deadlock test call)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

exten => _X.,1,NoOp(Deadlock test call to ${EXTEN})
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

[from-sipp-uac]
; Inbound calls from SIPp UAC — Dial out through PJSIP_HEADER endpoints
; This is the production pattern: incoming SIP → Dial() → chan_pjsip_new with set_var
exten => _.,1,NoOp(Inbound call from SIPp UAC)
 same => n,Set(ENDPOINT_IDX=${RAND(0,4)})
 same => n,Dial(PJSIP/s@deadlock-test-${ENDPOINT_IDX},30)
 same => n,Hangup()
