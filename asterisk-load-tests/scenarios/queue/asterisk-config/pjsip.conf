[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

; Two families of endpoints, both with a static contact at the SIPp UAS so
; every leg answers:
;
;   queue-caller-N : the leg the load generator originates. Once answered it
;                    runs the [queues] dialplan and enters Queue().
;   agent-N        : queue members (see queues.conf). app_queue dials these to
;                    deliver queued callers; the UAS answers and the call bridges.
;
; Add or remove blocks to match --num-endpoints (callers) and the member list
; in queues.conf (agents).

; --- Caller endpoints (originated by ari-load.py) --------------------------

[queue-caller-0]
type=endpoint
context=queues
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=queue-caller-0

[queue-caller-0]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[queue-caller-1]
type=endpoint
context=queues
disallow=all
