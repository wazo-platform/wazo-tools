[global]
type=global

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089

; Two families of endpoints, both with a static contact so every leg answers:
;
;   queue-caller-N : the leg the load generator originates (contact -> base `sipp`
;                    UAS, which only waits for Asterisk's BYE). Once answered it
;                    runs the [queues] dialplan and enters Queue().
;   agent-N        : queue members (see queues.conf). Their contact is the
;                    `sipp-agent` UAS, which answers, talks briefly, then hangs up
;                    so the member frees and the queue completes calls.
;
; Caller count must match --num-endpoints; agent count must match the member
; list in queues.conf.

; --- Caller endpoints (originated by ari-load.py) --------------------------

[queue-caller-0]
type=endpoint
context=queues
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=queue-caller-0

[queue-caller-0]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[queue-caller-1]
type=endpoint
context=queues
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=queue-caller-1

[queue-caller-1]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[queue-caller-2]
type=endpoint
context=queues
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=queue-caller-2

[queue-caller-2]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[queue-caller-3]
type=endpoint
context=queues
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=queue-caller-3

[queue-caller-3]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

[queue-caller-4]
type=endpoint
context=queues
disallow=all
allow=ulaw
allow=alaw
direct_media=no
aors=queue-caller-4

[queue-caller-4]
type=aor
max_contacts=1
contact=sip:s@sipp:5060

