[general]
static=yes
writeprotect=no

[queues]
; Calls originated by the load generator (PJSIP/queue-caller-N) land here once
; the caller leg answers, then enter a queue. Callers are spread across the two
; queues (loadtest-1 / loadtest-2) that share the same agent-N members, so
; shared_lastcall drives cross-queue member locking. app_queue dials the
; members until one answers and bridges.
exten => s,1,NoOp(Queue load test caller)
 same => n,Answer()
 same => n,Set(QNUM=${RAND(1,2)})
 same => n,Queue(loadtest-${QNUM})
 same => n,Hangup()

exten => _X.,1,NoOp(Queue load test caller to ${EXTEN})
 same => n,Answer()
 same => n,Set(QNUM=${RAND(1,2)})
 same => n,Queue(loadtest-${QNUM})
 same => n,Hangup()

[from-sipp-uac]
; Optional: inbound SIP calls from a SIPp UAC building block also enter a queue
; (see sipp/uac.xml and the commented sipp-uac service in the override).
exten => _.,1,NoOp(Inbound queue call from SIPp UAC)
 same => n,Answer()
 same => n,Set(QNUM=${RAND(1,2)})
 same => n,Queue(loadtest-${QNUM})
 same => n,Hangup()
