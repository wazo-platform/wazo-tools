[general]
persistentmembers = no

; autofill defaults to NO (legacy back-compat), which serves callers strictly
; one at a time even when many agents are free — so under load the queue dials
; only a trickle of members and the agent path is never exercised. Set yes so
; all waiting callers are distributed to free agents in parallel.
autofill = yes

; Share each member's lastcall/calls counters across every queue they belong
; to. This forces app_queue to walk and lock members across queues on each
; call event, which is the lock-ordering path that has caused deadlocks — the
; whole point of exercising it here.
shared_lastcall = yes

; Two queues sharing the SAME agent-N members (pjsip.conf). The shared member
; set is deliberate: combined with shared_lastcall above, a call event in one
; queue forces app_queue to update the member's counters in the other queue
; too — the cross-queue locking that drives the deadlock. Callers are spread
; across both queues by the [queues] dialplan.
;
; ringinuse = yes lets app_queue keep dialing members that are already on a
; call, so the sipp-agent UAS keeps the call rate high. Set it to no (and/or
; trim the member list) to instead exercise the queue-waiting / MOH path.
[loadtest](!)
strategy = rrmemory
timeout = 15
retry = 1
ringinuse = yes
musicclass = default
announce-frequency = 0
periodic-announce-frequency = 0

